<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tomohiro Fukushimaが公開するアプリのサポート情報です。">
    <link rel="canonical" href="https://tmfuku.github.io/app-support/">
    <title>アプリサポート</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header class="site-header">
        <a class="brand" href="./">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span>アプリサポート</span>
        </a>
      </header>

      <section class="hero portal-hero">
        <p class="eyebrow">APP SUPPORT</p>
        <h1>アプリごとの<br>サポート情報</h1>
        <p class="lead">
          サポート、プライバシーポリシー、よくあるご質問をアプリごとにご案内します。
        </p>
      </section>

      <section class="section" aria-labelledby="apps-title">
        <div class="section-heading">
          <p class="eyebrow">APPS</p>
          <h2 id="apps-title">公開中のアプリ</h2>
        </div>
        <div class="app-list">
          <a class="app-card" href="nagi-number-place/">
            <span class="brand-mark" aria-hidden="true">9</span>
            <span>
              <strong>凪ナンプレ</strong>
              <small>8桁の番号で同じ問題を共有できるナンプレ</small>
            </span>
            <span class="app-card-arrow" aria-hidden="true">›</span>
          </a>
          <a class="app-card" href="ima-jusho/">
            <span class="brand-mark" aria-hidden="true">⌖</span>
            <span>
              <strong>いま住所</strong>
              <small>現在地の住所と郵便番号をすぐ確認・共有</small>
            </span>
            <span class="app-card-arrow" aria-hidden="true">›</span>
          </a>
        </div>
      </section>

      <footer>
        <span>© 2026 Tomohiro Fukushima</span>
      </footer>
    </main>
  </body>
</html>
